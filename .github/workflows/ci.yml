name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser-companion tests
        if: runner.os != 'Windows'
        run: npx playwright install --with-deps chromium

      - name: Check native prerequisites
        shell: bash
        run: npm run doctor

      - name: Typecheck
        shell: bash
        run: npm run typecheck

      - name: Unit and integration tests
        shell: bash
        run: npm run test:ci

      - name: Package desktop app
        shell: bash
        run: npm run package

      - name: Make installers
        if: github.event_name == 'push'
        shell: bash
        run: npm run make

      - name: Upload installers
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: relay-desk-${{ runner.os }}
          path: out/make/**
          if-no-files-found: error
          retention-days: 14
