name: CI

on:
  push:
    branches: [main, "cross-platform/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser-companion tests
        if: runner.os != 'Windows'
        run: npx playwright install --with-deps chromium

      - name: Check native prerequisites
        shell: bash
        run: npm run doctor 2>&1 | tee -a ci.log

      - name: Typecheck
        shell: bash
        run: npm run typecheck 2>&1 | tee -a ci.log

      - name: Unit and integration tests
        shell: bash
        run: npm run test:ci 2>&1 | tee -a ci.log

      - name: Package desktop app
        shell: bash
        run: npm run package 2>&1 | tee -a ci.log

      - name: Make installers
        if: github.event_name == 'push'
        shell: bash
        run: npm run make 2>&1 | tee -a ci.log

      - name: Upload installers
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: relay-desk-${{ runner.os }}
          path: out/make/**
          if-no-files-found: error
          retention-days: 14

      - name: Keep log (temporary diagnostics)
        if: always() && startsWith(github.ref, 'refs/heads/cross-platform/')
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-${{ runner.os }}
          path: ci.log
          if-no-files-found: ignore

  # Temporary: private-repo CI logs are pushed to a branch so they can be fetched over SSH. Removed before merging.
  report:
    if: always() && startsWith(github.ref, 'refs/heads/cross-platform/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-log-*
          path: logs
      - name: Publish logs branch
        env:
          RESULT: ${{ needs.test.result }}
          TOKEN: ${{ github.token }}
        run: |
          cd logs
          echo "result=$RESULT sha=$GITHUB_SHA run=$GITHUB_RUN_ID" > SUMMARY.txt
          git init -q -b ci-results
          git config user.name "ci-diagnostics"
          git config user.email "ci-diagnostics@users.noreply.github.com"
          git add -A
          git commit -qm "CI logs for $GITHUB_SHA"
          git push -fq "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-results/latest