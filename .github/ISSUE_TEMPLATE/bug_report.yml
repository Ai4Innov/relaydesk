name: Bug report
description: Something in Relay Desk does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Do not paste real emails, addresses, tokens or attachments.** Use synthetic examples.
        Security issues must be reported privately; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings → Connections
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat / Copilot agent
        - Inbox / reading
        - Gmail Apps Script relay
        - Gmail API / Microsoft / Slack connector
        - Browser companion (Chrome / Edge)
        - Calendar
        - Attachments / search
        - Settings / installation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Relay Desk version or commit
  - type: input
    id: environment
    attributes:
      label: Windows and Node.js versions
      placeholder: Windows 11 23H2, Node 24.13.0
  - type: textarea
    id: logs
    attributes:
      label: Relevant error messages (redacted)
      render: text
